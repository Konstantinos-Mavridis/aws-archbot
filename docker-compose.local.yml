# ArchBot — fully local stack (no AWS account required)
#
# Services:
#   ollama    — local LLM inference (llama3, ~4 GB download on first start)
#   backend   — FastAPI on uvicorn with Chroma + Ollama instead of Bedrock + KB
#   frontend  — Next.js dev server
#
# Usage:
#   1. docker compose -f docker-compose.local.yml up
#   2. In a separate terminal, ingest WA docs once:
#        docker compose -f docker-compose.local.yml run --rm backend \
#          python scripts/ingest_docs.py --lens general --store chroma
#        docker compose -f docker-compose.local.yml run --rm backend \
#          python scripts/ingest_docs.py --lens fsi --store chroma
#   3. Open http://localhost:3000

services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Pull the model on first boot then keep serving
    entrypoint: >
      sh -c "ollama serve &
             sleep 8 &&
             ollama pull ${OLLAMA_MODEL:-llama3} &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    environment:
      # Local mode — Chroma + Ollama, no Bedrock / KB env vars set
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_PATH: /data/chroma_db
      # Disable AWS SDK credential resolution noise
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./backend:/app
      - chroma_data:/data/chroma_db
      - ./wa_docs:/app/wa_docs
    depends_on:
      ollama:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      # node_modules in a named volume so the host mount doesn't shadow it
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    command: sh -c "npm ci && npm run dev"

volumes:
  ollama_data:
  chroma_data:
  frontend_node_modules:
