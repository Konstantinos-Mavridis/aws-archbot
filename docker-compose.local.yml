# ArchBot — fully local stack
#
# Profiles:
#   default (no --profile)  — OpenRouter backend + frontend (no local GPU needed)
#   ollama                  — adds Ollama container for fully offline use
#
# Usage — OpenRouter (recommended, free tier):
#   1. cp backend/.env.example backend/.env
#      # Fill in OPENROUTER_API_KEY in backend/.env
#   2. docker compose -f docker-compose.local.yml up backend frontend
#   3. Open http://localhost:3000
#
# Usage — fully offline with Ollama:
#   1. docker compose -f docker-compose.local.yml --profile ollama up
#   2. Ingest docs once:
#        docker compose -f docker-compose.local.yml run --rm backend \
#          python scripts/ingest_docs.py --lens general --store chroma
#   3. Open http://localhost:3000
#
# For host Ollama (already running on your machine), use the override:
#   docker compose -f docker-compose.local.yml -f docker-compose.local.override.yml \
#     --profile ollama up backend frontend

services:
  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "ollama serve &
             sleep 8 &&
             ollama pull ${OLLAMA_MODEL:-llama3} &&
             wait"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.local
    ports:
      - "8000:8000"
    env_file:
      # Load LLM_PROVIDER, OPENROUTER_API_KEY, etc. from backend/.env
      # Copy backend/.env.example -> backend/.env and fill in your values.
      - ./backend/.env
    environment:
      # Ollama URL is only active when LLM_PROVIDER=ollama
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_PATH: /data/chroma_db
      AWS_DEFAULT_REGION: us-east-1
    volumes:
      - ./backend:/app
      - chroma_data:/data/chroma_db
      - ./wa_docs:/app/wa_docs
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    image: node:20-alpine
    working_dir: /app
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    command: sh -c "npm ci && npm run dev"

volumes:
  ollama_data:
  chroma_data:
  frontend_node_modules:
