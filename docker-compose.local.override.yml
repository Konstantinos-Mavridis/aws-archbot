# ArchBot — host Ollama override
#
# Use this when Ollama is already installed and running on your host machine
# (i.e. you don't want Docker to pull/run the ollama container).
#
# Usage:
#   docker compose -f docker-compose.local.yml -f docker-compose.local.override.yml up backend frontend
#
# Or set OLLAMA_MODEL in a .env file next to this file to switch models:
#   echo 'OLLAMA_MODEL=phi3' > .env
#
# Linux users: Docker Desktop maps host.docker.internal automatically.
# If you're on Linux without Docker Desktop, add this to the backend service:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"

services:
  # Remove the ollama container — we use the host installation instead
  ollama:
    profiles:
      - disabled   # effectively disables the service without removing it

  backend:
    # Drop the dependency on the ollama container
    depends_on: {}
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_PATH: /data/chroma_db
      AWS_DEFAULT_REGION: us-east-1

  frontend:
    # Frontend only needs backend to be started, not healthy yet
    depends_on:
      - backend
