# ArchBot — host Ollama override
#
# Use this when Ollama is already installed and running on your host machine.
# Disables the ollama container and points the backend at host.docker.internal.
#
# Usage:
#   docker compose -f docker-compose.local.yml -f docker-compose.local.override.yml up backend frontend
#
# Linux users: add this under the backend service if host.docker.internal doesn't resolve:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"

services:
  ollama:
    profiles:
      - disabled

  backend:
    depends_on:
      - frontend   # dummy self-reference trick removed; just clear by listing nothing real
    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      CHROMA_PATH: /data/chroma_db
      AWS_DEFAULT_REGION: us-east-1

  frontend:
    depends_on: []
