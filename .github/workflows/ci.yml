name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default: read-only. frontend-lint overrides to write so it can push the
# regenerated package-lock.json back to the branch (one-time self-heal).
permissions:
  contents: read

jobs:
  backend-lint-test:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check app tests scripts

      - name: Type-check with mypy
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v5
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-lint:
    name: Frontend — lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Cache npm dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-archbot-frontend
          restore-keys: |
            npm-${{ runner.os }}-archbot-frontend

      - name: Check lock file validity
        id: check-lock
        run: |
          lines=$(wc -l < package-lock.json 2>/dev/null || echo 0)
          if [ "$lines" -lt 50 ]; then
            echo "valid=false" >> $GITHUB_OUTPUT
          else
            echo "valid=true" >> $GITHUB_OUTPUT
          fi

      - name: Regenerate package-lock.json
        if: steps.check-lock.outputs.valid == 'false' && github.event_name == 'push'
        run: |
          npm install --package-lock-only
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(frontend): regenerate package-lock.json [skip ci]"
          git push

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build (verify static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com

  cdk-synth:
    name: CDK — synthesise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CDK dependencies
        run: pip install -r requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK synth (no AWS credentials needed)
        run: cdk synth --app 'python app.py' 2>&1
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
