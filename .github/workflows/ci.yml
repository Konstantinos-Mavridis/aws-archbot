name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-lint-test:
    name: Backend — lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Lint with ruff
        run: ruff check app tests scripts

      - name: Type-check with mypy
        run: mypy app

      - name: Run tests
        run: pytest --cov=app --cov-report=xml --cov-report=term-missing -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-lint:
    name: Frontend — lint & type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Detect whether a lockfile exists so we can enable npm caching safely.
      # setup-node throws "Some specified paths were not resolved" when
      # cache-dependency-path points to a file that doesn't exist yet.
      - name: Check for package-lock.json
        id: lockfile
        run: |
          if [ -f package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js 20 (with npm cache)
        if: steps.lockfile.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Set up Node.js 20 (no cache)
        if: steps.lockfile.outputs.exists != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build (verify static export)
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://placeholder.example.com

  cdk-synth:
    name: CDK — synthesise
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/cdk

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install CDK dependencies
        run: pip install -r requirements.txt

      - name: Install CDK CLI
        run: npm install -g aws-cdk

      - name: CDK synth (no AWS credentials needed)
        run: cdk synth --app 'python app.py' 2>&1
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1
