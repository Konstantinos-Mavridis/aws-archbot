name: CDK Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/cdk-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - '.github/workflows/cdk-deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]
      llm_provider:
        description: LLM provider (bedrock or openrouter)
        required: false
        default: openrouter
        type: choice
        options: [bedrock, openrouter]

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -----------------------------------------------------------------------
  # Preflight: detect whether AWS credentials are configured.
  # secrets context IS available inside steps (just not in job-level `if`).
  # -----------------------------------------------------------------------
  preflight:
    name: Preflight checks
    runs-on: ubuntu-latest
    outputs:
      has-credentials: ${{ steps.check.outputs.has-credentials }}
    steps:
      - name: Check for AWS deploy secret
        id: check
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
        run: |
          if [ -n "$ROLE_ARN" ]; then
            echo "has-credentials=true" >> $GITHUB_OUTPUT
          else
            echo "has-credentials=false" >> $GITHUB_OUTPUT
          fi

  # -----------------------------------------------------------------------
  # Build the Next.js static export (always runs).
  # -----------------------------------------------------------------------
  build-frontend:
    name: Build frontend static export
    runs-on: ubuntu-latest
    needs: preflight
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-out
          path: frontend/out/
          retention-days: 1

  # -----------------------------------------------------------------------
  # CDK diff — runs on PRs when real AWS credentials ARE configured.
  # -----------------------------------------------------------------------
  cdk-diff:
    name: CDK diff
    runs-on: ubuntu-latest
    needs: [preflight, build-frontend]
    if: |
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.has-credentials == 'true'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt

      - run: pip install -r infra/cdk/requirements.txt
      - run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-out
          path: frontend/out

      - name: CDK diff
        id: diff
        working-directory: infra/cdk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LLM_PROVIDER="${{ github.event.inputs.llm_provider || 'openrouter' }}"
          CDK_CONTEXT="-c llm_provider=${LLM_PROVIDER}"
          if [ "$LLM_PROVIDER" = "openrouter" ]; then
            CDK_CONTEXT="${CDK_CONTEXT} -c openrouter_api_key=${OPENROUTER_API_KEY}"
          fi
          OUTPUT=$(cdk diff --all $CDK_CONTEXT 2>&1) || true
          echo "$OUTPUT"
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## CDK Diff\n\n\`\`\`\n${{ steps.diff.outputs.diff }}\n\`\`\``
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  # -----------------------------------------------------------------------
  # CDK synth dry-run — runs on PRs when credentials are NOT configured.
  # Gives contributors a best-effort preview without hitting AWS.
  # -----------------------------------------------------------------------
  cdk-diff-dry-run:
    name: CDK diff (dry-run, no AWS)
    runs-on: ubuntu-latest
    needs: [preflight, build-frontend]
    if: |
      github.event_name == 'pull_request' &&
      needs.preflight.outputs.has-credentials == 'false'
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt

      - run: pip install -r infra/cdk/requirements.txt
      - run: npm install -g aws-cdk

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-out
          path: frontend/out

      - name: CDK synth (no credentials)
        id: synth
        working-directory: infra/cdk
        # Use a placeholder key so the CDK ValueError guard doesn't fire
        run: |
          OUTPUT=$(cdk synth --all \
            -c llm_provider=openrouter \
            -c openrouter_api_key=placeholder-dry-run \
            2>&1) || true
          echo "$OUTPUT"
          echo 'synth<<EOF' >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT
        env:
          CDK_DEFAULT_ACCOUNT: '000000000000'
          CDK_DEFAULT_REGION: us-east-1

      - name: Post synth summary as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = [
              '## CDK Synth (dry-run \u2014 no AWS credentials configured)',
              '',
              '> To enable a real `cdk diff` against your AWS account, add the',
              '> `AWS_DEPLOY_ROLE_ARN` secret. See **[docs/adr/0003-deployment-strategy.md]',
              '> (../docs/adr/0003-deployment-strategy.md)** for setup instructions.',
              '',
              '```',
              `${{ steps.synth.outputs.synth }}`,
              '```',
            ].join('\n')
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  # -----------------------------------------------------------------------
  # CDK deploy — runs on push to main or workflow_dispatch.
  # Skipped (not failed) when credentials are absent.
  # -----------------------------------------------------------------------
  cdk-deploy:
    name: CDK deploy -> ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: [preflight, build-frontend]
    if: |
      needs.preflight.outputs.has-credentials == 'true' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt

      - run: pip install -r infra/cdk/requirements.txt
      - run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-out
          path: frontend/out

      - name: CDK synth
        working-directory: infra/cdk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LLM_PROVIDER="${{ github.event.inputs.llm_provider || 'openrouter' }}"
          CDK_CONTEXT="-c llm_provider=${LLM_PROVIDER}"
          if [ "$LLM_PROVIDER" = "openrouter" ]; then
            CDK_CONTEXT="${CDK_CONTEXT} -c openrouter_api_key=${OPENROUTER_API_KEY}"
          fi
          cdk synth --all $CDK_CONTEXT

      - name: CDK deploy
        working-directory: infra/cdk
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          LLM_PROVIDER="${{ github.event.inputs.llm_provider || 'openrouter' }}"
          CDK_CONTEXT="-c llm_provider=${LLM_PROVIDER}"
          if [ "$LLM_PROVIDER" = "openrouter" ]; then
            CDK_CONTEXT="${CDK_CONTEXT} -c openrouter_api_key=${OPENROUTER_API_KEY}"
          fi
          cdk deploy --all --require-approval=never \
            --outputs-file cdk-outputs.json \
            $CDK_CONTEXT

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v7
        with:
          name: cdk-outputs
          path: infra/cdk/cdk-outputs.json
