name: CDK Deploy

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

concurrency:
  group: cdk-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-frontend:
    name: Build frontend static export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.API_URL }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-out
          path: frontend/out/
          retention-days: 1

  cdk-diff:
    name: CDK diff
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.event_name == 'pull_request'
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r infra/cdk/requirements.txt
      - run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download frontend artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-out
          path: frontend/out

      - name: CDK diff
        id: diff
        working-directory: infra/cdk
        run: |
          OUTPUT=$(cdk diff --all 2>&1) || true
          echo "$OUTPUT"
          echo 'diff<<EOF' >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo 'EOF' >> $GITHUB_OUTPUT

      - name: Post diff as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## CDK Diff\n\n\`\`\`\n${{ steps.diff.outputs.diff }}\n\`\`\``
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            })

  cdk-deploy:
    name: CDK deploy → ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    needs: build-frontend
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: ${{ github.event.inputs.environment || 'dev' }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r infra/cdk/requirements.txt
      - run: npm install -g aws-cdk

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Download frontend artifact
        uses: actions/download-artifact@v5
        with:
          name: frontend-out
          path: frontend/out

      - name: CDK synth
        working-directory: infra/cdk
        run: cdk synth --all

      - name: CDK deploy
        working-directory: infra/cdk
        run: cdk deploy --all --require-approval=never --outputs-file cdk-outputs.json

      - name: Upload CDK outputs
        uses: actions/upload-artifact@v5
        with:
          name: cdk-outputs
          path: infra/cdk/cdk-outputs.json
